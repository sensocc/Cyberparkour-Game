name: Deploy to GitHub Pages

# Builds the demo and publishes `dist/` to GitHub Pages on every push to main.
# The build uses a relative base (`base: './'` in vite.config.ts), so it serves
# correctly from the repository's Pages sub-path.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages needs write access to the deployment environment, unlike CI.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:only

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Enables GitHub Pages on first run, so a fresh repository deploys
          # without a manual trip to the repo's Pages settings.
          enablement: true

      - name: Upload the build
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
