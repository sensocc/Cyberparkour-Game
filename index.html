<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Cyberparkour - a low-poly, Quake-styled first-person parkour game set in a cyberpunk city. Technical demo."
    />
    <title>Cyberparkour // Technical Demo</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2305070c'/%3E%3Cpath d='M6 23 L16 7 L26 23' fill='none' stroke='%2358deff' stroke-width='3.5' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <!--
      #canvas-host is wiped and repopulated on every restart: a fresh <canvas>
      guarantees a fresh WebGL context, because a canvas whose context has been
      lost never hands out another one.
    -->
    <div id="app">
      <div id="canvas-host"></div>
      <div id="ui-root"></div>
      <noscript>
        <p class="noscript">Cyberparkour needs JavaScript and WebGL to run.</p>
      </noscript>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
